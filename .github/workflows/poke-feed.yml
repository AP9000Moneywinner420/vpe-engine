# One on-demand pull of the odds feed (used by the closing-prices task). 11/23: it starts feed-run.yml in this repo,
# which does the pull on free minutes and falls back to the private repo by itself.
name: poke-feed
on:
  workflow_dispatch:
permissions:
  actions: write
jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: Ask for a fresh pull
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/feed-run.yml/dispatches -d '{"ref":"main"}')
          echo "feed poke -> HTTP $code"; [ "$code" = "204" ]
