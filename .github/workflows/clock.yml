# A steady 20-minute clock for the odds feed. GitHub's own "schedule" trigger fires only a few times a day on this
# account, so this job stays awake and pokes the feed job itself. It holds no odds data and no odds API key: only a
# narrow token (secret VPE_ODDS_DISPATCH_TOKEN) that may start workflows in the private feed repo.
name: clock
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 15-23 * * *"
    - cron: "7,37 0-4 * * *"
permissions:
  actions: write
concurrency:
  group: clock
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Poke the feed every 20 minutes during game hours (11 AM to 1 AM Eastern)
        env:
          TOKEN: ${{ secrets.VPE_ODDS_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TOKEN" ]; then echo "VPE_ODDS_DISPATCH_TOKEN is not set: nothing to do"; exit 0; fi
          end=$(( $(date +%s) + 19200 ))   # 5 h 20 min, then hand over to a fresh run
          # awake = 8 AM to 1 AM Eastern (so the morning task can start it early); pokes only 11 AM to 1 AM
          awake() { h=$(TZ=America/New_York date +%-H); [ "$h" -ge 8 ] || [ "$h" -lt 1 ]; }
          inside() { h=$(TZ=America/New_York date +%-H); [ "$h" -ge 11 ] || [ "$h" -lt 1 ]; }
          while [ "$(date +%s)" -lt "$end" ] && awake; do
            if inside; then
              # 11/23: the pull now runs in this repo (feed-run.yml, free minutes); it falls back to the private repo by itself
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/${{ github.repository }}/actions/workflows/feed-run.yml/dispatches -d '{"ref":"main","inputs":{"src":"clock"}}')
              echo "$(TZ=America/New_York date '+%H:%M ET') feed poke -> HTTP $code"
            else
              echo "$(TZ=America/New_York date '+%H:%M ET') waiting for 11 AM"
            fi
            sleep 1200
          done
          if awake; then
            gh api -X POST repos/${{ github.repository }}/actions/workflows/clock.yml/dispatches -f ref=main && echo "handed over to a fresh clock run"
          else
            echo "after 1 AM: clock stops until tomorrow"
          fi
